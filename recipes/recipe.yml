# yaml-language-server: $schema=https://blue-build.org
name: custom-silverblue-x12
description: Vollständig ausgestattetes Fedora für das ThinkPad X12 Detachable mit Sway

base-image: ghcr.io/fedora-cloud/fedora-sway-atomic:latest

modules:
  # 1. RPM-Fusion Quellen für Multimedia-Codecs, VLC und Grafiktreiber aktivieren
  - type: rpm-ostree
    repos:
      - https://rpmfusion.org
      - https://rpmfusion.org

  # 2. Systemprogramme, Hardware-Treiber und CLI-Tools (RPM-Layering)
  - type: rpm-ostree
    install:
      # --- Ihre Kern- und Netzwerkprogramme ---
      - firefox
      - keepassxc
      - nmap
      - vim
      - neomutt
      - brz                 # Bazaar-Nachfolger (Breezy)
      - chromium
      - nextcloud-client
      - remmina
      - remmina-plugins-rdp

      # --- Ihre neuen System-, Sicherheits- und Krypto-Tools ---
      - yubikey-manager     # CLI-Verwaltung für YubiKeys
      - pcsc-lite           # Zwingend erforderlich für Smartcards/YubiKeys/Nitrokeys
      - nitrokey-app        # Grafische Verwaltung für Nitrokeys (App 1/2-Unterstützung)
      - testdisk            # Datenrettung und Partitions-Reparatur
      - rkhunter            # Rootkit Hunter Sicherheits-Scanner
      - pwgen               # Passwort-Generator für das Terminal
      - unzip               # Standard-Entpacker
      - screen              # Terminal-Multiplexer
      - mosh                # Mobile Shell (robuste SSH-Alternative für unterwegs)

      # --- LaTeX-Umgebung (Vollständig mit deutschem Sprachpaket) ---
      - texlive-scheme-medium # Enthält LaTeX und die wichtigsten Basispakete
      - texlive-lang-german # Deutsche Trennmuster, Dokumentationen und Pakete
      - vim-latexsuite      # Die mächtige LaTeX-Erweiterung für Vim

      # --- Audio, Video & Kamera-Infrastruktur ---
      - pipewire            # Kern-Audiosystem (Sway-Standard)
      - pipewire-utils      # CLI-Werkzeuge für Audio-Routing
      - v4l-utils           # Video4Linux-Utilities zur Kamera-Konfiguration
      - akmod-v4l2loopback  # Kernel-Modul für virtuelle Webcams (z.B. für OBS Studio)
      - kmod-v4l2loopback   # Laufzeit-Binärdatei für das v4l2-Loopback-Modul
      - brightnessctl       # Hardware-Helligkeitssteuerung

      # --- Audio-Ripping, Codecs und Metadaten-Editoren ---
      - abcde               # "A Better CD Encoder" (Automatisches CLI-Ripping)
      - flac                # FLAC-Audio-Codec-Werkzeuge
      - opus-tools          # Opus-Audio-Codec-Werkzeuge
      - id3v2               # ID3v2-Tag-Editor für MP3s
      - id3lib              # ID3-Bibliothek für Software-Kompatibilität
      - mp3split            # Präzises Schneiden von MP3/OGG-Dateien ohne Qualitätsverlust
      - mpg123              # Schneller Konsolen-MP3-Player

      # --- Grafik, Druck & Dateimanager ---
      - imagemagick         # Mächtige CLI-Bildbearbeitung
      - pdfposter           # Skaliert PDFs auf Postergröße (Kacheldruck)
      - gutenprint          # Hochwertige Druckertreiber-Bibliothek
      - nautilus
      - nautilus-nextcloud
      - yazi
      - ffmpegthumbnailer
      - poppler-utils
      - jq

      # --- Hardware, Rotation, Schoner & Strom sparen ---
      - tlp
      - tlp-rdw
      - iio-sensor-proxy
      - rot8
      - swaylock            # Der offizielle, sichere Bildschirmschoner/Sperrbildschirm für Sway
      - swayidle            # Hintergrunddienst für automatischen Standby/Bildschirmschoner
      - sway-audio-idle-inhibit # Pausiert Schoner bei Video/Audio
      - libwacom
      - libwacom-utils
      - xf86-input-wacom
      - squeekboard
      - xournalpp
      - waybar

  # 3. Systemd-Dienste direkt beim Image-Bau aktivieren
  - type: systemd
    system:
      enabled:
        - tlp.service
        - iio-sensor-proxy.service
        - pcscd.service     # Aktiviert den Smartcard-Hintergrunddienst für YubiKey/Nitrokey

  # 4. Desktop-Anwendungen via Flatpak (Sicher, isoliert und performant)
  - type: flatpak
    remotes:
      - name: flathub
        url: https://flathub.org
    install:
      - org.videolan.VLC
      - org.telegram.desktop
      - org.signal.Signal
      - ch.threema.threema-web-desktop
      - com.obsproject.Studio
      - org.gnome.Papers    # Der moderne GNOME PDF-Betrachter
      - org.gnome.eog       # "Eye of GNOME" Bildbetrachter
